<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Industrial Collage Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Page shell - preserve original blue background and rounded white card aesthetic */
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #1967db;
      color: #333;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .site-wrap {
      background: #fff;
      width: 100%;
      max-width: 1100px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .header-bar {
      padding: 28px 32px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2c3e50, #95a5a6);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .brand-title {
      margin: 0;
      font-size: 1.4rem;
      color: #2c3e50;
      font-weight: 700;
    }

    .brand-sub {
      margin: 0;
      color: #7f8c8d;
      font-size: 0.9rem;
      font-weight: 400;
    }

    .filter-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-button {
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid #e1e5ea;
      background: #f7f9fb;
      color: #2c3e50;
      cursor: pointer;
      font-weight: 600;
      transition: transform .15s ease, background .2s ease;
    }

    .filter-button:hover { transform: translateY(-1px); }
    .filter-button.is-active { background: #3498db; color: #fff; border-color: #3498db; }

    .search-field {
      flex: 1 1 220px;
      min-width: 200px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #e1e5ea;
      background: #fff;
      font-size: 0.95rem;
      color: #2c3e50;
    }

    /* Collage (masonry via CSS columns) */
    .collage-wrap {
      padding: 22px 26px 28px;
    }

    .collage {
      column-count: 3;
      column-gap: 18px;
    }

    .tile-card {
      display: inline-block;
      width: 100%;
      margin: 0 0 18px;
      border-radius: 16px;
      overflow: hidden;
      background: #ecf0f1;
      position: relative;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      break-inside: avoid;
    }

    .tile-media { width: 100%; display: block; }

    .tile-overlay {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.65) 100%);
      color: #fff;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .tile-title { font-size: 0.95rem; font-weight: 700; margin: 0; }
    .tile-meta { font-size: 0.8rem; opacity: 0.9; }

    /* Footer */
    .footer-bar {
      padding: 14px 26px 26px;
      color: #7f8c8d;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .counter-pill {
      background: #f1f5f9;
      color: #2c3e50;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 600;
      border: 1px solid #e1e5ea;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .collage { column-count: 2; }
    }
    @media (max-width: 640px) {
      .header-bar { padding: 22px; }
      .collage-wrap { padding: 18px; }
      .collage { column-count: 1; }
    }
  </style>
</head>
<body>
  <main class="site-wrap">
    <header class="header-bar">
      <div class="brand-block">
        <div class="brand-mark">IN</div>
        <div>
          <h1 class="brand-title">Industrial Collage Gallery</h1>
          <p class="brand-sub">Modern manufacturing, logistics, energy, and construction imagery</p>
        </div>
      </div>
      <div class="filter-toolbar">
        <button class="filter-button is-active" data-filter="all">All</button>
        <button class="filter-button" data-filter="recent">Recent</button>
        <button class="filter-button" data-filter="best">Best</button>
        <input type="search" class="search-field" id="searchInput" placeholder="Search tags (e.g. refinery, robots)" />
      </div>
    </header>

    <section class="collage-wrap">
      <div id="collage" class="collage" aria-live="polite"></div>
    </section>

    <div class="footer-bar">
      <span id="counter" class="counter-pill">0 items</span>
      <span>Auto-fetched from curated industrial sources</span>
    </div>
  </main>

  <script>
    const state = {
      raw: [],
      view: [],
      active: 'all',
      q: ''
    };

    const el = {
      collage: document.getElementById('collage'),
      counter: document.getElementById('counter'),
      search: document.getElementById('searchInput'),
      buttons: []
    };

    function fmtDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: '2-digit' });
    }

    function render() {
      el.collage.innerHTML = state.view.map(item => `
        <figure class="tile-card" data-id="${item.id}">
          <img class="tile-media" loading="lazy" src="${item.url}" alt="${item.alt}" />
          <figcaption class="tile-overlay">
            <div>
              <p class="tile-title">${item.title}</p>
              <p class="tile-meta">${fmtDate(item.date)} • ⭐ ${item.rating.toFixed(1)}</p>
            </div>
            <div class="tile-meta">${item.tags.slice(0,3).join(', ')}</div>
          </figcaption>
        </figure>
      `).join('');
      el.counter.textContent = `${state.view.length} items`;
    }

    function applyFilters() {
      const q = state.q.trim().toLowerCase();
      let list = [...state.raw];

      if (q) {
        list = list.filter(x =>
          x.title.toLowerCase().includes(q) ||
          x.tags.some(t => t.toLowerCase().includes(q))
        );
      }

      if (state.active === 'recent') {
        list.sort((a,b) => new Date(b.date) - new Date(a.date));
      } else if (state.active === 'best') {
        list = list.filter(x => x.rating >= 4.5).sort((a,b) => b.rating - a.rating || new Date(b.date) - new Date(a.date));
      } else {
        // all: stable sort by date desc for sensible default
        list.sort((a,b) => new Date(b.date) - new Date(a.date));
      }

      state.view = list;
      render();
    }

    function setActiveButton(key) {
      el.buttons.forEach(btn => btn.classList.toggle('is-active', btn.dataset.filter === key));
    }

    async function boot() {
      try {
        const res = await fetch('data/gallery.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to fetch gallery data');
        const data = await res.json();
        state.raw = Array.isArray(data) ? data : [];
        state.active = 'all';
        applyFilters();
      } catch (err) {
        console.error(err);
        el.collage.innerHTML = '<p>Unable to load gallery at this time.</p>';
      }
    }

    // Events
    document.addEventListener('DOMContentLoaded', () => {
      el.buttons = Array.from(document.querySelectorAll('.filter-button'));
      el.buttons.forEach(btn => btn.addEventListener('click', () => {
        state.active = btn.dataset.filter;
        setActiveButton(state.active);
        applyFilters();
      }));

      el.search.addEventListener('input', (e) => {
        state.q = e.target.value;
        applyFilters();
      });

      boot();
    });
  </script>
</body>
</html>
