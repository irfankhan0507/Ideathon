<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EduScan AI Detector</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    /* General Body */
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #1967db;
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Container */
    .container {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    p.subtitle {
      font-size: 1rem;
      color: #7f8c8d;
      margin-bottom: 25px;
    }

    /* File input */
    input[type=file] {
      padding: 12px 15px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }

    /* Textarea */
    textarea {
      width: 100%;
      height: 200px;
      margin-top: 20px;
      border-radius: 12px;
      border: 1px solid #ccc;
      padding: 15px;
      font-size: 0.95rem;
      resize: none;
      color: #333;
      background-color: #fefefe;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
    }

    /* Button */
    button {
      margin-top: 25px;
      padding: 15px 30px;
      font-size: 1.05rem;
      background-color: #3498db;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: #fff;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background-color: #2980b9;
      transform: scale(1.05);
    }

    /* Result box */
    #resultBox {
      margin-top: 30px;
      padding: 25px;
      border-radius: 15px;
      background: #ecf0f1;
      font-size: 1.2rem;
      font-weight: 500;
      line-height: 1.5;
      color: #2c3e50;
    }

    /* Progress Bar */
    .progress {
      margin-top: 20px;
      width: 100%;
      background: #dcdcdc;
      border-radius: 20px;
      overflow: hidden;
      height: 28px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #2ecc71;
      text-align: center;
      line-height: 28px;
      color: #fff;
      font-weight: bold;
      transition: width 1s ease-in-out;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>EduScan 📄 AI Detector</h1>
    <p class="subtitle">Upload your PDF assignment to check if it is AI-generated or human-written</p>

    <input type="file" id="fileInput" accept="application/pdf"><br>
    <textarea id="userInput" placeholder="Extracted PDF text will appear here..."></textarea><br>
    <button onclick="runAI()">Analyze Document</button>

    <div id="resultBox"></div>
    <div class="progress"><div class="progress-bar" id="progressBar">0%</div></div>
  </div>

  <script>
    // PDF Text Extractor
    document.getElementById("fileInput").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if(file && file.type === "application/pdf") {
        const reader = new FileReader();
        reader.onload = function() {
          const typedarray = new Uint8Array(this.result);
          pdfjsLib.getDocument(typedarray).promise.then(pdf => {
            let text = "";
            const promises = [];
            for(let i=1; i<=pdf.numPages; i++){
              promises.push(pdf.getPage(i).then(page => 
                page.getTextContent().then(content => {
                  text += content.items.map(s=>s.str).join(" ") + " ";
                })
              ));
            }
            Promise.all(promises).then(()=> {
              document.getElementById("userInput").value = text.trim();
            });
          });
        };
        reader.readAsArrayBuffer(file);
      } else {
        alert("⚠️ Please upload a valid PDF file.");
      }
    });

    // AI Detection Logic
    function runAI(){
      const input = document.getElementById("userInput").value.trim();
      const resultBox = document.getElementById("resultBox");
      const progressBar = document.getElementById("progressBar");

      if(!input){
        resultBox.innerText = "⚠️ No text found. Upload a PDF first.";
        return;
      }

      const sentences = input.split(/[.!?]/).filter(s => s.trim().length > 0);
      const words = input.split(/\s+/);
      const avgSentenceLength = words.length / sentences.length;
      const uniqueWords = new Set(words.map(w => w.toLowerCase()));
      const vocabRichness = uniqueWords.size / words.length;

      let humanScore = 100 - ((avgSentenceLength > 25 ? 15 : 0) + (vocabRichness < 0.35 ? 20 : 0) + (words.length > 1000 ? 10 : 0));
      humanScore = Math.max(Math.min(humanScore, 100), 0);
      const aiProbability = 100 - humanScore;

      progressBar.style.width = aiProbability + "%";
      progressBar.innerText = aiProbability.toFixed(0) + "% AI";

      if(aiProbability > 60){
        resultBox.innerHTML = `🤖 AI Detected: <b>${aiProbability.toFixed(1)}% AI-generated</b><br>Humanization Score: <b>${humanScore.toFixed(1)}%</b>`;
        resultBox.style.color = "#e74c3c";
      } else {
        resultBox.innerHTML = `📝 Likely Human-written: <b>${(100-aiProbability).toFixed(1)}% Human</b><br>AI Probability: <b>${aiProbability.toFixed(1)}%</b>`;
        resultBox.style.color = "#27ae60";
      }
    }
  </script>
</body>
</html>
