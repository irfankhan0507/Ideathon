<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CIA Next — Career Opportunities</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="https://cdn.builder.io/api/v1/image/assets%2Fa180d3e502ea4bf0922bba9c817ddbe4%2F13a5568b42344d13af0dc08dfaf227ab?format=webp&width=800" />
  <style>
    :root {
      --blue: #1E40AF;
      --red: #DC2626;
      --gold: #F1C40F;
      --dark: #0F172A;
      --white: #FFFFFF;
      --light-bg: #F5F7FA;
      --gray: #64748B;
      --shadow: 0 12px 30px rgba(15,23,42,0.08);
      --shadow-lg: 0 20px 50px rgba(15,23,42,0.12);
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0f172a;
      color: var(--dark);
      overflow-x: hidden;
      position: relative;
    }

    /* 3D Animated Background */
    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: linear-gradient(180deg, #0f172a 0%, #1a2847 50%, #111827 100%);
      overflow: hidden;
    }

    .bg-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, rgba(30, 64, 175, 0.08) 1px, transparent 1px),
        linear-gradient(rgba(30, 64, 175, 0.08) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridShift 20s linear infinite;
    }

    @keyframes gridShift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }

    .bg-container::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(30, 64, 175, 0.15), transparent 50%),
                  radial-gradient(ellipse at 80% 80%, rgba(220, 38, 38, 0.1), transparent 50%);
      pointer-events: none;
    }

    .bg-shape {
      position: absolute;
      opacity: 0.25;
      filter: blur(80px);
    }

    .shape-1 {
      width: 500px;
      height: 500px;
      background: linear-gradient(135deg, #1E40AF, #3B82F6);
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      top: -150px;
      left: -200px;
      animation: float 25s infinite ease-in-out;
    }

    .shape-2 {
      width: 450px;
      height: 450px;
      background: linear-gradient(135deg, #DC2626, rgba(220, 38, 38, 0.6));
      border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      bottom: -150px;
      right: -150px;
      animation: float 28s infinite ease-in-out reverse;
      animation-delay: -2s;
    }

    .shape-3 {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.4), rgba(251, 191, 36, 0.2));
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
      top: 45%;
      right: 5%;
      animation: float 30s infinite ease-in-out;
      animation-delay: -4s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) rotateZ(0deg);
      }
      25% {
        transform: translate(30px, -30px) rotateZ(5deg);
      }
      50% {
        transform: translate(0, 50px) rotateZ(-5deg);
      }
      75% {
        transform: translate(-30px, -20px) rotateZ(3deg);
      }
    }

    .parallax-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: rgba(59, 130, 246, 0.4);
      border-radius: 50%;
      animation: particle-float 8s infinite ease-in-out;
      box-shadow: 0 0 20px rgba(30, 64, 175, 0.5);
    }

    .particle:nth-child(1) { width: 8px; height: 8px; top: 10%; left: 20%; animation-delay: 0s; }
    .particle:nth-child(2) { width: 12px; height: 12px; top: 30%; left: 60%; animation-delay: 1s; }
    .particle:nth-child(3) { width: 6px; height: 6px; top: 50%; left: 80%; animation-delay: 2s; }
    .particle:nth-child(4) { width: 10px; height: 10px; top: 70%; left: 30%; animation-delay: 1.5s; }
    .particle:nth-child(5) { width: 8px; height: 8px; top: 20%; left: 90%; animation-delay: 0.5s; }

    @keyframes particle-float {
      0%, 100% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-30px); opacity: 0.7; }
    }

    /* Main content wrapper */
    .dashboard-wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header/Navigation */
    .dashboard-header {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.92) 0%, rgba(26, 40, 71, 0.88) 100%);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(30, 64, 175, 0.2);
      padding: 16px 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .header-branding {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: fit-content;
    }

    .header-logo {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--white);
      font-size: 24px;
    }

    .header-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .header-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--white);
    }

    .header-subtitle {
      margin: 0;
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1;
    }

    .header-search {
      display: flex;
      align-items: center;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 28px;
      padding: 10px 16px;
      gap: 10px;
      border: 1px solid rgba(30, 64, 175, 0.3);
      flex: 1;
      max-width: 400px;
      transition: all 0.3s ease;
    }

    .header-search:hover,
    .header-search:focus-within {
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(30, 64, 175, 0.6);
      box-shadow: 0 0 12px rgba(30, 64, 175, 0.2);
    }

    .header-search svg {
      width: 20px;
      height: 20px;
      stroke: #94a3b8;
      flex-shrink: 0;
    }

    .header-search input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      flex: 1;
      color: var(--white);
    }

    .header-search input::placeholder {
      color: #64748b;
    }

    /* Main content area */
    .dashboard-main {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* Hero section */
    .hero-section {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero-title {
      margin: 0 0 12px;
      font-size: 36px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--red), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subtitle {
      margin: 0;
      font-size: 18px;
      color: var(--gray);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Filter section */
    .filter-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filter-label {
      font-weight: 600;
      color: var(--dark);
      font-size: 14px;
      margin: 0;
    }

    .filter-button {
      padding: 10px 18px;
      border-radius: 10px;
      border: 1.5px solid #e2e8f0;
      background: var(--white);
      color: #475569;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    .filter-button:hover {
      border-color: #1E40AF;
      background: linear-gradient(135deg, #eff6ff, #f0f9ff);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(30, 64, 175, 0.1);
    }

    .filter-button.active {
      background: linear-gradient(135deg, #1E40AF, #3B82F6);
      color: var(--white);
      border-color: #1E40AF;
      box-shadow: 0 8px 20px rgba(30, 64, 175, 0.3);
    }

    .filter-button.internship-active {
      background: var(--blue);
      color: var(--white);
      border-color: var(--blue);
    }

    .filter-button.work-active {
      background: var(--green);
      color: var(--white);
      border-color: var(--green);
    }

    .counter-info {
      font-size: 14px;
      color: #64748b;
      padding: 8px 14px;
      background: linear-gradient(135deg, rgba(30, 64, 175, 0.08), rgba(59, 130, 246, 0.05));
      border-radius: 8px;
      border: 1px solid rgba(30, 64, 175, 0.15);
      white-space: nowrap;
    }

    /* Cards grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-bottom: 40px;
    }

    /* Opportunity card */
    .opportunity-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8f9fa 100%);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      border: 1px solid rgba(30, 64, 175, 0.1);
    }

    .opportunity-card:hover {
      transform: translateY(-12px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      border-color: rgba(30, 64, 175, 0.3);
    }

    .card-header {
      position: relative;
      height: 160px;
      overflow: hidden;
      background: linear-gradient(135deg, #f0f4f8, #e8f1f9);
    }

    .card-logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .category-badge {
      position: absolute;
      top: 12px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
      color: var(--white);
      background: linear-gradient(135deg, #1E40AF, #3B82F6);
    }

    .category-badge.work {
      background: linear-gradient(135deg, #DC2626, #EF4444);
    }

    .card-body {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-company {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 8px;
      color: var(--dark);
    }

    .card-description {
      font-size: 14px;
      color: var(--gray);
      line-height: 1.5;
      margin: 0 0 12px;
      flex: 1;
    }

    .card-location {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      color: var(--gray);
      margin-bottom: 8px;
    }

    .card-location svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-top: 1px;
      stroke: var(--gray);
    }

    .card-email {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      color: #1E40AF;
      margin-bottom: 12px;
      text-decoration: none;
      word-break: break-all;
    }

    .card-email svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-top: 1px;
      stroke: #1E40AF;
    }

    .card-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .tag {
      background: linear-gradient(135deg, #eff6ff, #f0f9ff);
      color: #1E40AF;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid rgba(30, 64, 175, 0.15);
    }

    .card-rating {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--dark);
    }

    .rating-stars {
      color: #FCD34D;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }

    .action-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid #e0e8f0;
      background: var(--white);
      color: var(--dark);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
      white-space: nowrap;
    }

    .action-btn:hover {
      border-color: #1E40AF;
      color: #1E40AF;
      background: #eff6ff;
      transform: translateY(-2px);
    }

    .action-btn.primary {
      background: var(--blue);
      color: var(--white);
      border-color: var(--blue);
    }

    .action-btn.primary:hover {
      background: #1e3a8a;
      border-color: #1e3a8a;
      box-shadow: 0 8px 16px rgba(30, 64, 175, 0.2);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--gray);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 18px;
      margin: 0;
      color: var(--dark);
      font-weight: 600;
    }

    .empty-state-desc {
      font-size: 14px;
      margin: 8px 0 0;
      color: var(--gray);
    }

    /* Footer */
    .dashboard-footer {
      padding: 24px;
      text-align: center;
      color: #cbd5e1;
      font-size: 14px;
      border-top: 1px solid rgba(30, 64, 175, 0.2);
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%);
      margin-top: 40px;
      backdrop-filter: blur(10px);
    }

    /* Detail Modal */
    .detail-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
      overflow-y: auto;
      animation: fadeIn 0.3s ease;
    }

    .detail-modal.is-open {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .detail-container {
      background: linear-gradient(180deg, #ffffff 0%, #f8f9fa 100%);
      border-radius: 16px;
      max-width: 1100px;
      width: 100%;
      position: relative;
      margin-top: 40px;
      margin-bottom: 40px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(30, 64, 175, 0.1);
    }

    @keyframes slideUp {
      from {
        transform: translateY(40px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .detail-header {
      background: linear-gradient(135deg, #1E40AF, #3B82F6);
      padding: 40px;
      color: var(--white);
      border-radius: 20px 20px 0 0;
      position: relative;
      overflow: hidden;
    }

    .detail-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1), transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1), transparent 50%);
      pointer-events: none;
    }

    .detail-header-work {
      background: linear-gradient(135deg, #DC2626, #EF4444);
    }

    .detail-top {
      display: flex;
      align-items: flex-start;
      gap: 30px;
      position: relative;
      z-index: 1;
    }

    .detail-logo {
      width: 120px;
      height: 120px;
      border-radius: 16px;
      object-fit: cover;
      border: 4px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .detail-header-text h1 {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
    }

    .detail-header-text p {
      margin: 0;
      font-size: 16px;
      opacity: 0.95;
      line-height: 1.5;
    }

    .detail-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.25);
      color: var(--white);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 12px;
      backdrop-filter: blur(10px);
    }

    .detail-content {
      padding: 40px;
    }

    .detail-section {
      margin-bottom: 40px;
      padding-bottom: 40px;
      border-bottom: 1px solid #e5e7eb;
    }

    .detail-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .detail-section-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 20px;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .detail-section-title svg {
      width: 24px;
      height: 24px;
      stroke: #1E40AF;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .detail-item {
      padding: 16px;
      background: #f9fafb;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    .detail-item-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .detail-item-value {
      font-size: 16px;
      font-weight: 600;
      color: var(--dark);
    }

    .detail-overview {
      font-size: 16px;
      line-height: 1.6;
      color: #4b5563;
      background: #f9fafb;
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid #1E40AF;
    }

    .detail-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .detail-list li {
      padding: 12px 0;
      padding-left: 28px;
      position: relative;
      color: #4b5563;
      line-height: 1.6;
      border-bottom: 1px solid #e5e7eb;
    }

    .detail-list li:last-child {
      border-bottom: none;
    }

    .detail-list li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: #22C55E;
      font-weight: 700;
      font-size: 18px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .gallery-item {
      border-radius: 12px;
      overflow: hidden;
      height: 180px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover {
      transform: translateY(-4px);
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    .detail-actions {
      display: flex;
      gap: 12px;
    }

    .detail-close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--white);
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .detail-close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(90deg);
    }

    .card-company,
    .card-logo {
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .card-company:hover {
      color: var(--blue);
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }

      .dashboard-main {
        padding: 28px 20px;
      }
    }

    @media (max-width: 1024px) {
      .hero-title {
        font-size: 28px;
      }

      .header-content {
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
      }

      .header-search {
        max-width: 100%;
      }

      .filter-section {
        flex-direction: column;
        align-items: stretch;
      }

      .filter-group {
        width: 100%;
      }

      .counter-info {
        width: 100%;
        text-align: center;
      }
    }

    @media (max-width: 640px) {
      .dashboard-main {
        padding: 16px 12px;
      }

      .dashboard-header {
        padding: 12px 16px;
      }

      .header-content {
        gap: 12px;
      }

      .header-logo {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }

      .header-title {
        font-size: 16px;
      }

      .header-subtitle {
        display: none;
      }

      .header-search {
        max-width: 100%;
      }

      .hero-title {
        font-size: 24px;
      }

      .hero-subtitle {
        font-size: 14px;
      }

      .cards-grid {
        grid-template-columns: 1fr;
      }

      .card-actions {
        flex-direction: column;
      }

      .action-btn {
        padding: 12px 16px;
      }

      .filter-section {
        gap: 12px;
      }

      .filter-button {
        padding: 8px 14px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <!-- 3D Animated Background -->
  <div class="bg-container">
    <div class="shape-1"></div>
    <div class="shape-2"></div>
    <div class="shape-3"></div>
    <div class="parallax-layer" id="parallaxLayer">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard-wrapper">
    <!-- Header -->
    <header class="dashboard-header">
      <div class="header-content">
        <div class="header-branding">
          <div class="header-logo">
            <img src="https://cdn.builder.io/api/v1/image/assets%2Fa180d3e502ea4bf0922bba9c817ddbe4%2F13a5568b42344d13af0dc08dfaf227ab?format=webp&width=800" alt="CIA Next logo" />
          </div>
          <div>
            <h1 class="header-title">CIA Next</h1>
            <p class="header-subtitle">Industrial Excellence Portal</p>
          </div>
        </div>
        <div class="header-search" role="search">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input id="searchInput" type="search" placeholder="Search opportunities..." aria-label="Search opportunities" />
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="dashboard-main">
      <!-- Hero Section -->
      <section class="hero-section">
        <h2 class="hero-title">Discover Opportunities</h2>
        <p class="hero-subtitle">Explore internships and career positions at industry-leading organizations</p>
      </section>

      <!-- Filter Section -->
      <div class="filter-section">
        <div class="filter-group">
          <label class="filter-label">Category:</label>
          <button class="filter-button active" data-filter="all" id="filterAll">All Opportunities</button>
          <button class="filter-button" data-filter="internship" id="filterInternship">Internships</button>
          <button class="filter-button" data-filter="work" id="filterWork">Job Opportunities</button>
        </div>
        <div class="counter-info" id="counterInfo">Loading...</div>
      </div>

      <!-- Cards Grid -->
      <div class="cards-grid" id="cardsGrid">
        <div class="empty-state">
          <div class="empty-state-icon">⏳</div>
          <p class="empty-state-text">Loading opportunities...</p>
          <p class="empty-state-desc">Please wait while we fetch the data</p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="dashboard-footer">
      <p style="margin: 0;">© 2025 CIA Next. Discover Industrial Excellence & Career Opportunities.</p>
    </footer>
  </div>

  <!-- Detail Modal -->
  <div class="detail-modal" id="detailModal">
    <div class="detail-container" id="detailContainer">
      <button class="detail-close-btn" id="detailCloseBtn" aria-label="Close detail view">✕</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <script>
    // State management
    const state = {
      allData: [],
      filteredData: [],
      activeFilter: 'all',
      searchQuery: '',
      selectedItem: null,
    };

    const elements = {
      cardsGrid: document.getElementById('cardsGrid'),
      searchInput: document.getElementById('searchInput'),
      counterInfo: document.getElementById('counterInfo'),
      filterButtons: document.querySelectorAll('[data-filter]'),
      parallaxLayer: document.getElementById('parallaxLayer'),
      detailModal: document.getElementById('detailModal'),
      detailContent: document.getElementById('detailContent'),
      detailCloseBtn: document.getElementById('detailCloseBtn'),
    };

    // Parallax effect on mouse move
    document.addEventListener('mousemove', (e) => {
      const x = e.clientX / window.innerWidth;
      const y = e.clientY / window.innerHeight;
      if (elements.parallaxLayer) {
        const particles = elements.parallaxLayer.querySelectorAll('.particle');
        particles.forEach((particle, idx) => {
          const speed = (idx + 1) * 2;
          const offsetX = x * speed * 20;
          const offsetY = y * speed * 20;
          particle.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
        });
      }
    });

    // Format date helper
    function formatDate(isoString) {
      const date = new Date(isoString);
      return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: '2-digit' });
    }

    // Render cards
    function renderCards() {
      const { filteredData } = state;

      if (filteredData.length === 0) {
        elements.cardsGrid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state-icon">🔍</div>
            <p class="empty-state-text">No opportunities found</p>
            <p class="empty-state-desc">Try adjusting your filters or search criteria</p>
          </div>
        `;
        return;
      }

      elements.cardsGrid.innerHTML = filteredData.map(item => `
        <article class="opportunity-card" data-id="${item.id}">
          <div class="card-header">
            <img class="card-logo" src="${item.logo}" alt="${item.company} logo" loading="lazy" />
            <div class="category-badge ${item.category === 'work' ? 'work' : ''}">
              ${item.categoryLabel}
            </div>
          </div>
          <div class="card-body">
            <h3 class="card-company">${item.company}</h3>
            <p class="card-description">${item.description}</p>
            <div class="card-location">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1118 0z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="10" r="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>${item.location}</span>
            </div>
            <a href="mailto:${item.email}" class="card-email">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="m2 6 10 7 10-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>${item.email}</span>
            </a>
            <div class="card-tags">
              ${item.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
            </div>
            <div class="card-rating">
              <span class="rating-stars">★</span>
              <span>${item.rating.toFixed(1)}</span>
            </div>
            <div class="card-actions">
              <button class="action-btn">View Details</button>
              <button class="action-btn primary">Apply Now</button>
            </div>
          </div>
        </article>
      `).join('');

      updateCounter();

      // Attach click handlers to card company name and image
      Array.from(document.querySelectorAll('.card-company, .card-logo')).forEach(el => {
        el.addEventListener('click', (e) => {
          const card = el.closest('.opportunity-card');
          if (card) {
            const itemId = card.dataset.id;
            const item = state.allData.find(d => d.id === itemId);
            if (item) {
              openDetailView(item);
            }
          }
        });
      });
    }

    // Open detail view
    function openDetailView(item) {
      state.selectedItem = item;
      const isWork = item.category === 'work';
      const headerGradient = isWork ? 'detail-header-work' : '';

      const requirementsHTML = item.requirements.map(req =>
        `<li>${req}</li>`
      ).join('');

      const responsibilitiesHTML = item.responsibilities.map(resp =>
        `<li>${resp}</li>`
      ).join('');

      const galleryHTML = item.galleryImages.map(img =>
        `<div class="gallery-item"><img src="${img}" alt="Product" loading="lazy" /></div>`
      ).join('');

      elements.detailContent.innerHTML = `
        <div class="detail-header ${headerGradient}">
          <div class="detail-top">
            <img class="detail-logo" src="${item.logo}" alt="${item.company} logo" loading="lazy" />
            <div class="detail-header-text">
              <h1>${item.company}</h1>
              <p>${item.overview}</p>
              <span class="detail-badge">${item.category_business}</span>
            </div>
          </div>
        </div>

        <div class="detail-content">
          <div class="detail-section">
            <h2 class="detail-section-title">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
                <path d="M4 20c0-5.523 3.582-10 8-10s8 4.477 8 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              Company Information
            </h2>
            <div class="detail-grid">
              <div class="detail-item">
                <div class="detail-item-label">Founder</div>
                <div class="detail-item-value">${item.founder}</div>
              </div>
              <div class="detail-item">
                <div class="detail-item-label">Website</div>
                <div class="detail-item-value"><a href="${item.website}" target="_blank" style="color: #1E40AF; text-decoration: none;">Visit Website</a></div>
              </div>
              <div class="detail-item">
                <div class="detail-item-label">Email</div>
                <div class="detail-item-value"><a href="mailto:${item.email}" style="color: #1E40AF; text-decoration: none;">${item.email}</a></div>
              </div>
              <div class="detail-item">
                <div class="detail-item-label">Phone</div>
                <div class="detail-item-value">${item.phone}</div>
              </div>
              <div class="detail-item">
                <div class="detail-item-label">Location</div>
                <div class="detail-item-value">${item.location}</div>
              </div>
              <div class="detail-item">
                <div class="detail-item-label">Operating Region</div>
                <div class="detail-item-value">${item.operatingRegion}</div>
              </div>
            </div>
          </div>

          <div class="detail-section">
            <h2 class="detail-section-title">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8m3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z" stroke="none" fill="currentColor"/>
              </svg>
              Products & Services
            </h2>
            <div style="display: flex; flex-wrap: wrap; gap: 10px;">
              ${item.products.map(product =>
                `<span class="tag" style="background: #eff6ff; color: #1E40AF;">${product}</span>`
              ).join('')}
            </div>
          </div>

          <div class="detail-section">
            <h2 class="detail-section-title">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 10c0-6-3-10-8-10S4 4 4 10c0 5.25 3.07 9.3 7 9.9v3.1h2v-3.1c3.93-.6 7-4.65 7-9.9z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              ${item.jobRole}
            </h2>
            <div class="detail-grid" style="margin-bottom: 20px;">
              <div class="detail-item">
                <div class="detail-item-label">Salary</div>
                <div class="detail-item-value">${item.salary}</div>
              </div>
              <div class="detail-item">
                <div class="detail-item-label">Duration</div>
                <div class="detail-item-value">${item.duration}</div>
              </div>
            </div>
          </div>

          <div class="detail-section">
            <h2 class="detail-section-title">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Requirements
            </h2>
            <ul class="detail-list">
              ${requirementsHTML}
            </ul>
          </div>

          <div class="detail-section">
            <h2 class="detail-section-title">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" stroke="none" fill="currentColor"/>
              </svg>
              Responsibilities
            </h2>
            <ul class="detail-list">
              ${responsibilitiesHTML}
            </ul>
          </div>

          <div class="detail-section">
            <h2 class="detail-section-title">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 5a2 2 0 012-2h12a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Gallery
            </h2>
            <div class="gallery-grid">
              ${galleryHTML}
            </div>
          </div>

          <div style="padding-top: 20px; border-top: 1px solid #e5e7eb;">
            <div class="detail-actions">
              <button class="action-btn" onclick="document.getElementById('detailModal').classList.remove('is-open')">Back</button>
              <button class="action-btn primary">Apply Now</button>
            </div>
          </div>
        </div>
      `;

      elements.detailModal.classList.add('is-open');
    }

    // Update counter
    function updateCounter() {
      const count = state.filteredData.length;
      const filter = state.activeFilter === 'all' ? 'all opportunities' :
                     state.activeFilter === 'internship' ? 'internships' :
                     'job opportunities';
      elements.counterInfo.textContent = `${count} ${filter}`;
    }

    // Apply filters and search
    function applyFilters() {
      let filtered = [...state.allData];

      // Apply category filter
      if (state.activeFilter !== 'all') {
        filtered = filtered.filter(item => item.category === state.activeFilter);
      }

      // Apply search filter
      if (state.searchQuery.trim()) {
        const query = state.searchQuery.toLowerCase();
        filtered = filtered.filter(item =>
          item.company.toLowerCase().includes(query) ||
          item.description.toLowerCase().includes(query) ||
          item.tags.some(tag => tag.toLowerCase().includes(query)) ||
          item.location.toLowerCase().includes(query)
        );
      }

      state.filteredData = filtered;
      renderCards();
    }

    // Set active filter button
    function setActiveFilterButton() {
      elements.filterButtons.forEach(btn => {
        const isActive = btn.dataset.filter === state.activeFilter;
        btn.classList.toggle('active', isActive);
        if (state.activeFilter === 'internship' && isActive) {
          btn.classList.add('internship-active');
          btn.classList.remove('work-active');
        } else if (state.activeFilter === 'work' && isActive) {
          btn.classList.add('work-active');
          btn.classList.remove('internship-active');
        } else {
          btn.classList.remove('internship-active', 'work-active');
        }
      });
    }

    // Close detail modal
    function closeDetailView() {
      elements.detailModal.classList.remove('is-open');
      state.selectedItem = null;
    }

    // Event listeners
    elements.filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeFilter = btn.dataset.filter;
        setActiveFilterButton();
        applyFilters();
      });
    });

    elements.searchInput.addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      applyFilters();
    });

    elements.detailCloseBtn.addEventListener('click', closeDetailView);
    elements.detailModal.addEventListener('click', (e) => {
      if (e.target === elements.detailModal) {
        closeDetailView();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && elements.detailModal.classList.contains('is-open')) {
        closeDetailView();
      }
    });

    // Load data
    async function loadData() {
      try {
        const response = await fetch('dashboard.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('Failed to fetch dashboard data');
        state.allData = await response.json();
        state.activeFilter = 'all';
        setActiveFilterButton();
        applyFilters();
      } catch (error) {
        console.error('Error loading data:', error);
        elements.cardsGrid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state-icon">⚠️</div>
            <p class="empty-state-text">Unable to load opportunities</p>
            <p class="empty-state-desc">Please try refreshing the page</p>
          </div>
        `;
      }
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
